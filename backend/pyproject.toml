[tool.poetry]
name = "backend"
version = "0.1.0"
description = "Matching worker + data layer for the audio fingerprint matching app"

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.34"

# API-only dependencies. The API layer is being rebuilt; these stay
# declared so backend/main.py and backend/api/ remain installable.
fastapi = "^0.110"
uvicorn = "^0.27"
python-multipart = "^0.0.9"

[tool.poetry.dev-dependencies]
pytest = "^8.0"
black = "^24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
